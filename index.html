<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosper</title>
    <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<div class="site">
    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="#account">Login</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <h1 class="pixel">🔥 Prosper</h1>
        <p class="pixel-small">Premium Modpacks • Schematics • Minecraft Content</p>
        <div class="hero-buttons">
            <a href="modpacks.html" class="btn-red">Modpacks</a>
            <a href="schematics.html" class="btn-red">Schematics</a>
            <a href="videos.html" class="btn-red">Videos</a>
        </div>
    </header>

    <section id="account" class="hero" style="margin-top:40px;">
        <h1 class="pixel">Account</h1>
        <div class="auth-box">
            <h3 class="pixel-small">Register</h3>
            <input id="reg-email" placeholder="Email" type="email">
            <input id="reg-password" placeholder="Password" type="password">
            <button class="btn-red" onclick="registerUser()">Register</button>
            <h3 class="pixel-small" style="margin-top:20px;">Login</h3>
            <input id="login-email" placeholder="Email" type="email">
            <input id="login-password" placeholder="Password" type="password">
            <button class="btn-red" onclick="loginUser()">Login</button>
        </div>
        <button id="logout-btn" class="btn-red" style="margin-top:20px; display:none;" onclick="logoutUser()">Logout</button>
        <a id="dashboard-link" href="dashboard.html" class="btn-red" style="margin-top:20px; display:none;">Open Dashboard</a>
        <p id="status" class="pixel-small" style="margin-top:20px;"></p>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const client = createClient(
  "https://gthgxmyccwsygbopksgz.supabase.co",
  "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
);
const status = document.getElementById("status");

async function registerUser() {
  const email = document.getElementById("reg-email").value.trim();
  const password = document.getElementById("reg-password").value;
  if (!email || !password) { status.textContent = "Enter an email and password."; return; }
  const { error } = await client.auth.signUp({ email, password });
  status.textContent = error ? "Signup failed: " + error.message : "Account created! Check your email to confirm.";
}

async function loginUser() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  if (!email || !password) { status.textContent = "Enter an email and password."; return; }
  status.textContent = "Logging in...";

  const { data, error } = await client.auth.signInWithPassword({ email, password });
  if (error) { status.textContent = "Login failed: " + error.message; return; }

  const user = data.user;
  const { data: profile, error: profileError } = await client
    .from("profiles").select("Username").eq("id", user.id).maybeSingle();
  if (profileError) { status.textContent = "Profile error: " + profileError.message; return; }
  if (!profile) {
    const { error: insertError } = await client.from("profiles").insert({ id: user.id, Email: user.email, Username: null });
    if (insertError) { status.textContent = "Profile error: " + insertError.message; return; }
  }
  if (!profile?.Username) { window.location.href = "set-username.html"; return; }
  updateStatus();
}

async function logoutUser() {
  await client.auth.signOut();
  updateStatus();
}

async function updateStatus() {
  const { data: { user } } = await client.auth.getUser();
  const authBox = document.querySelector(".auth-box");
  const logoutButton = document.getElementById("logout-btn");
  const dashboardLink = document.getElementById("dashboard-link");
  if (!user) {
    status.textContent = "Not logged in.";
    authBox.style.display = "block";
    logoutButton.style.display = "none";
    dashboardLink.style.display = "none";
    return;
  }
  const { data: profile } = await client.from("profiles").select("Username").eq("id", user.id).maybeSingle();
  status.textContent = `Welcome back, ${profile?.Username || user.email}!`;
  authBox.style.display = "none";
  logoutButton.style.display = "inline-block";
  dashboardLink.style.display = "inline-block";
}

updateStatus();
</script>
</body>
</html>
