<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosper</title>
    <link rel="stylesheet" href="/goatedmc/style.css?v=3">
</head>

<body>
<div class="site">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="#account">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="hero">
        <h1 class="pixel">🔥 Prosper</h1>
        <p class="pixel-small">Premium Modpacks • Schematics • Minecraft Content</p>

        <div class="hero-buttons">
            <a href="modpacks.html" class="btn-red">Modpacks</a>
            <a href="schematics.html" class="btn-red">Schematics</a>
            <a href="videos.html" class="btn-red">Videos</a>
        </div>
    </header>

    <!-- ACCOUNT SECTION -->
    <section id="account" class="hero" style="margin-top:40px;">
        <h1 class="pixel">Account</h1>

        <div class="auth-box">

            <h3 class="pixel-small">Register</h3>
            <input id="reg-email" placeholder="Email">
            <input id="reg-password" placeholder="Password" type="password">
            <button class="btn-red" onclick="registerUser()">Register</button>

            <h3 class="pixel-small" style="margin-top:20px;">Login</h3>
            <input id="login-email" placeholder="Email">
            <input id="login-password" placeholder="Password" type="password">
            <button class="btn-red" onclick="loginUser()">Login</button>

            <button class="btn-red" style="margin-top:20px;" onclick="logoutUser()">Logout</button>

        </div>
    </section>

</div>

<!-- SUPABASE + ACCOUNT SYSTEM -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js?v=3"></script>

<script>
const supabase = supabase.createClient(
  "https://gthgxmyccwsygbopksgz.supabase.co",
  "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
);

// REGISTER
async function registerUser() {
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) {
    alert("Signup failed: " + error.message);
    return;
  }

  if (!data.user) {
    alert("Signup failed: No user returned.");
    return;
  }

  alert("Account created! Check your email to confirm.");
}

// LOGIN
async function loginUser() {
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert("Login failed: " + error.message);
    return;
  }

  if (!data.session) {
    alert("Login failed: No session returned.");
    return;
  }

  alert("Logged in!");
}

// LOGOUT
async function logoutUser() {
  await supabase.auth.signOut();
  alert("Logged out!");
}
</script>

</body>
</html>
