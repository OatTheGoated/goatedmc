<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Username</title>
    <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>
<div class="site">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
            </ul>
        </div>
    </nav>

    <!-- USERNAME SETUP -->
    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Choose a Username</h1>
        <p class="pixel-small">This will be your public name on Prosper.</p>

        <div class="auth-box" style="margin-top:20px;">
            <input id="username" placeholder="Enter a username">
            <button class="btn-red" onclick="saveUsername()">Save Username</button>
            <p id="status" class="pixel-small" style="margin-top:20px; color: #00ff88;"></p>
        </div>
    </section>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const client = createClient(
  "https://gthgxmyccwsygbopksgz.supabase.co",
  "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
);

async function saveUsername() {
  const status = document.getElementById("status");
  const username = document.getElementById("username").value.trim();

  status.style.color = "#00ff88";
  status.textContent = "Checking...";

  // Make sure session is loaded
  await client.auth.getSession();

  const { data: { user }, error: userError } = await client.auth.getUser();

  if (userError) {
    status.textContent = "Auth error: " + userError.message;
    status.style.color = "#ff6b6b";
    return;
  }

  if (!user) {
    status.textContent = "You must be logged in.";
    status.style.color = "#ff6b6b";
    return;
  }

  if (!username) {
    status.textContent = "Please enter a username.";
    status.style.color = "#ff6b6b";
    return;
  }

  if (username.length < 3) {
    status.textContent = "Username must be at least 3 characters.";
    status.style.color = "#ff6b6b";
    return;
  }

  // 1. Ensure a profile row exists for this user
  const { data: profile, error: profileError } = await client
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (profileError) {
    status.textContent = "Error loading profile: " + profileError.message;
    status.style.color = "#ff6b6b";
    return;
  }

  if (!profile) {
    // Create profile row if missing
    const { error: insertError } = await client
      .from("profiles")
      .insert({
        id: user.id,
        Email: user.email,      // adjust if your column is different
        Username: username      // or `username` if lowercase in DB
      });

    if (insertError) {
      status.textContent = "Error creating profile: " + insertError.message;
      status.style.color = "#ff6b6b";
      return;
    }

    status.textContent = "Username saved! Redirecting to dashboard...";
    status.style.color = "#00ff88";

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1000);

    return;
  }

  // 2. Check if username is already taken by someone else
  const { data: existing, error: lookupError } = await client
    .from("profiles")
    .select("id, Username")
    .eq("Username", username)
    .maybeSingle();

  if (lookupError) {
    status.textContent = "Error checking username: " + lookupError.message;
    status.style.color = "#ff6b6b";
    return;
  }

  if (existing && existing.id !== user.id) {
    status.textContent = "That username is already taken.";
    status.style.color = "#ff6b6b";
    return;
  }

  // 3. Update this user's username
  const { error: updateError } = await client
    .from("profiles")
    .update({ Username: username })   // or `username` if lowercase
    .eq("id", user.id);

  if (updateError) {
    status.textContent = "Error saving username: " + updateError.message;
    status.style.color = "#ff6b6b";
    console.error("Username update error:", updateError);
    return;
  }

  status.textContent = "Username saved! Redirecting to dashboard...";
  status.style.color = "#00ff88";

  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 1000);
}
</script>

</body>
</html>
