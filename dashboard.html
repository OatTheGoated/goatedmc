<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=22">
</head>

<body>
<div class="site">

    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Your Dashboard</h1>

        <div class="auth-box">
            <h3 class="pixel-small">Account Info</h3>
            <p>Email: <span id="emailDisplay"></span></p>
            <p>User ID: <span id="idDisplay"></span></p>
            <p>Username: <span id="usernameDisplay"></span></p>

            <h3 class="pixel-small" style="margin-top:20px;">Profile Picture</h3>
            <img id="profilePic" src="" alt="Profile Picture" style="width:128px; border-radius:8px; margin-bottom:10px;">

            <label class="pixel-small" style="margin-bottom:6px; display:block;">
                Enter your Minecraft UUID (32 characters, no dashes):
            </label>

            <input id="mcUUID" placeholder="2982b204842f4220a668f73fa9822c6d">

            <button class="btn-red" onclick="saveProfilePic()" style="margin-top:10px;">
                Save Profile Picture
            </button>

            <button class="btn-red" style="margin-top:20px;" onclick="logout()">Logout</button>
        </div>
    </section>

</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://gthgxmyccwsygbopksgz.supabase.co",
        "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
    );

    async function loadDashboard() {
        const { data: { user } } = await supabase.auth.getUser();

        if (!user) {
            window.location.href = "/prosper/login.html";
            return;
        }

        document.getElementById("emailDisplay").textContent = user.email;
        document.getElementById("idDisplay").textContent = user.id;

        const { data, error } = await supabase
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .maybeSingle();

        if (error) {
            console.error(error);
            document.getElementById("usernameDisplay").textContent = "Unknown";
            return;
        }

        if (data) {
            document.getElementById("usernameDisplay").textContent = data.Username || "Unknown";
            if (data.pfp_url) {
                document.getElementById("profilePic").src = data.pfp_url;
            }
        }
    }

    loadDashboard();

    document.getElementById("mcUUID").addEventListener("input", () => {
        let uuid = document.getElementById("mcUUID").value.trim().replace(/-/g, "");
        if (uuid.length === 32) {
            document.getElementById("profilePic").src =
                `https://crafatar.com/avatars/${uuid}?size=128&overlay`;
        }
    });

    window.saveProfilePic = async function () {
        let uuid = document.getElementById("mcUUID").value.trim().replace(/-/g, "");
        if (uuid.length !== 32) {
            alert("UUID must be exactly 32 characters.");
            return;
        }

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            alert("You must be logged in.");
            return;
        }

        const pfpURL = `https://crafatar.com/avatars/${uuid}?size=128&overlay`;

        const { error } = await supabase
            .from("profiles")
            .update({ pfp_url: pfpURL })
            .eq("id", user.id);

        if (error) {
            console.error(error);
            alert("Failed to save profile picture.");
            return;
        }

        document.getElementById("profilePic").src = pfpURL;
        alert("Profile picture updated!");
    };

    // ⭐ FULL SESSION RESET LOGOUT (fixes upload RLS errors)
    window.logout = async function () {
        await supabase.auth.signOut();

        // Clear corrupted sessions from old clients
        localStorage.clear();
        sessionStorage.clear();

        window.location.href = "/prosper/index.html";
    };
</script>

</body>
</html>
