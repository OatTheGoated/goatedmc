<!-- Supabase CDN (must be FIRST) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Auth System (creates supabaseClient) -->
<script src="./AuthSystem.js"></script>

<script>
// ⭐ Use the client created in AuthSystem.js
let client;

window.addEventListener("DOMContentLoaded", async () => {
    client = window.supabaseClient;

    if (!client) {
        console.error("supabaseClient not found. Check AuthSystem.js.");
        return;
    }

    await loadDashboard();
});

// ⭐ Load dashboard data
async function loadDashboard() {
    const user = await AuthSystem.getUser();

    if (!user) {
        window.location.href = "/prosper/login.html";
        return;
    }

    document.getElementById("emailDisplay").textContent = user.email;
    document.getElementById("idDisplay").textContent = user.id;

    const { data, error } = await client
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {
        console.error(error);
        document.getElementById("usernameDisplay").textContent = "Unknown";
        return;
    }

    if (data) {
        document.getElementById("usernameDisplay").textContent = data.Username || "Unknown";

        if (data.pfp_url) {
            document.getElementById("profilePic").src = data.pfp_url;
        }
    }
}

// ⭐ GLOBAL: saveProfilePic
window.saveProfilePic = async function () {
    const mcName = document.getElementById("mcUsername").value.trim();
    if (!mcName) return alert("Enter a Minecraft username.");

    const pfpURL = `https://crafatar.com/avatars/${mcName}?size=128&overlay`;

    const user = await AuthSystem.getUser();
    if (!user) {
        alert("You must be logged in.");
        return;
    }

    const { error } = await client
        .from("profiles")
        .update({ pfp_url: pfpURL })
        .eq("id", user.id);

    if (error) {
        console.error(error);
        alert("Failed to save profile picture.");
        return;
    }

    document.getElementById("profilePic").src = pfpURL;
    alert("Profile picture updated!");
};

// ⭐ GLOBAL: logout
window.logout = async function () {
    await AuthSystem.logout();
    window.location.href = "/prosper/index.html";
};
</script>
