<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>
<div class="site">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="#" onclick="logout()" style="color:#ff6b6b;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- DASHBOARD CONTENT -->
    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Welcome back, <span id="usernameDisplay">...</span></h1>
        <p class="pixel-small">This is your Prosper dashboard.</p>

        <div class="auth-box" style="margin-top:20px;">
            <p class="pixel-small">Email: <span id="emailDisplay"></span></p>
            <p class="pixel-small">User ID: <span id="idDisplay"></span></p>
        </div>
    </section>

</div>

<!-- SUPABASE + AUTH SYSTEM -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./auth.js?v=3"></script>

<script>
async function loadDashboard() {
    // Wait for AuthSystem to initialize
    await AuthSystem.init();

    // If not logged in → redirect
    if (!AuthSystem.isLoggedIn()) {
        window.location.href = "index.html#account";
        return;
    }

    const user = AuthSystem.getUser();
    const profile = AuthSystem.getProfile();

    // If no profile or no username → redirect to username page
    if (!profile || !profile.Username) {
        window.location.href = "set-username.html";
        return;
    }

    // Display user info
    document.getElementById("usernameDisplay").textContent = profile.Username;
    document.getElementById("emailDisplay").textContent = user.email;
    document.getElementById("idDisplay").textContent = user.id;
}

async function logout() {
    await AuthSystem.logout();
    window.location.href = "index.html";
}

// Load dashboard on page load
document.addEventListener("DOMContentLoaded", loadDashboard);
</script>

</body>
</html>
