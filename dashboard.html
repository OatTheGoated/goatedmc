<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=22">
</head>

<body>
<div class="site">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <!-- DASHBOARD CONTENT -->
    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Your Dashboard</h1>

        <div class="auth-box">

            <h3 class="pixel-small">Account Info</h3>
            <p>Email: <span id="emailDisplay"></span></p>
            <p>User ID: <span id="idDisplay"></span></p>
            <p>Username: <span id="usernameDisplay"></span></p>

            <h3 class="pixel-small" style="margin-top:20px;">Profile Picture</h3>

            <!-- LIVE PREVIEW -->
            <img id="profilePic" src="" alt="Profile Picture" style="width:128px; border-radius:8px; margin-bottom:10px;">

            <!-- USERNAME OR UUID INPUT -->
            <label class="pixel-small" style="margin-bottom:6px; display:block;">
                Enter your Minecraft Username or UUID:
            </label>

            <input id="mcUUID" placeholder="e.g. OatTheGoated OR 2982b204842f4220a668f73fa9822c6d">

            <p style="font-size:13px; opacity:0.8; margin-top:5px;">
                Username is recommended — UUID will auto‑fetch.
            </p>

            <button class="btn-red" onclick="saveProfilePic()" style="margin-top:10px;">
                Save Profile Picture
            </button>

            <button class="btn-red" style="margin-top:20px;" onclick="logout()">Logout</button>
        </div>

    </section>

</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Auth System -->
<script src="./AuthSystem.js"></script>

<script>
// ⭐ Use the client created in AuthSystem.js
let client;

window.addEventListener("DOMContentLoaded", async () => {
    client = window.supabaseClient;

    if (!client) {
        console.error("supabaseClient not found. Check AuthSystem.js.");
        return;
    }

    await loadDashboard();
});

// ⭐ Load dashboard data
async function loadDashboard() {
    await AuthSystem.init();

    const user = await AuthSystem.getUser();

    if (!user) {
        window.location.href = "/prosper/login.html";
        return;
    }

    document.getElementById("emailDisplay").textContent = user.email;
    document.getElementById("idDisplay").textContent = user.id;

    const { data, error } = await client
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {
        console.error(error);
        document.getElementById("usernameDisplay").textContent = "Unknown";
        return;
    }

    if (data) {
        document.getElementById("usernameDisplay").textContent = data.Username || "Unknown";

        if (data.pfp_url) {
            document.getElementById("profilePic").src = data.pfp_url;
        }
    }
}

// ⭐ Detect username OR UUID and show preview
document.getElementById("mcUUID").addEventListener("input", async () => {
    let value = document.getElementById("mcUUID").value.trim();

    // Case 1: UUID typed
    if (value.replace(/-/g, "").length === 32) {
        const uuid = value.replace(/-/g, "");
        const previewURL = `https://crafatar.com/avatars/${uuid}?size=128&overlay`;
        document.getElementById("profilePic").src = previewURL;
        return;
    }

    // Case 2: Username typed
    if (/^[A-Za-z0-9_]{3,16}$/.test(value)) {
        try {
            const res = await fetch(`https://api.ashcon.app/mojang/v2/user/${value}`);
            if (!res.ok) return;

            const data = await res.json();
            const uuid = data.uuid.replace(/-/g, "");

            const previewURL = `https://crafatar.com/avatars/${uuid}?size=128&overlay`;
            document.getElementById("profilePic").src = previewURL;
        } catch (err) {
            console.error("Username lookup failed:", err);
        }
    }
});

// ⭐ Save PFP (username OR UUID)
window.saveProfilePic = async function () {
    let input = document.getElementById("mcUUID").value.trim();
    let uuid = "";

    // Case 1: UUID entered
    if (input.replace(/-/g, "").length === 32) {
        uuid = input.replace(/-/g, "");
    }

    // Case 2: Username entered → fetch UUID
    else if (/^[A-Za-z0-9_]{3,16}$/.test(input)) {
        try {
            const res = await fetch(`https://api.ashcon.app/mojang/v2/user/${input}`);
            if (!res.ok) return alert("Invalid username.");

            const data = await res.json();
            uuid = data.uuid.replace(/-/g, "");
        } catch (err) {
            console.error(err);
            return alert("Failed to fetch UUID from username.");
        }
    }

    else {
        return alert("Enter a valid UUID or Minecraft username.");
    }

    if (uuid.length !== 32) {
        return alert("UUID must be exactly 32 characters.");
    }

    const pfpURL = `https://crafatar.com/avatars/${uuid}?size=128&overlay`;

    await AuthSystem.init();
    const user = await AuthSystem.getUser();

    if (!user) {
        alert("You must be logged in.");
        return;
    }

    const { error } = await client
        .from("profiles")
        .update({ pfp_url: pfpURL })
        .eq("id", user.id);

    if (error) {
        console.error(error);
        alert("Failed to save profile picture.");
        return;
    }

    document.getElementById("profilePic").src = pfpURL;
    alert("Profile picture updated!");
};

// ⭐ Logout
window.logout = async function () {
    await AuthSystem.logout();
    window.location.href = "/prosper/index.html";
};
</script>

</body>
</html>
