<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./style.css?v=20">
</head>

<body>
<div class="site">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- DASHBOARD CONTENT -->
    <div class="dashboard-container">

        <h2 class="pixel">Welcome back, <span id="usernameDisplay">Loading...</span></h2>
        <p>Your email: <span id="emailDisplay">Loading...</span></p>
        <p>Your user ID: <span id="idDisplay">Loading...</span></p>

        <hr>

        <!-- PROFILE PICTURE BOX -->
        <div class="profile-box">
            <h3 class="pixel">Your Profile Picture</h3>

            <img id="profilePic" src="" alt="Profile Picture" class="pfp-img">

            <div class="pfp-input">
                <input type="text" id="mcUsername" placeholder="Minecraft Username">
                <button onclick="saveProfilePic()">Set Profile Picture</button>
            </div>
        </div>

    </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Auth System -->
<script src="./AuthSystem.js?v=20"></script>

<script>
const supabase = Supabase.createClient(
    "https://gthgxmyccwsygbopksgz.supabase.co",
    "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
);

async function loadDashboard() {
    const user = await AuthSystem.getUser();

    if (!user) {
        window.location.href = "/prosper/login.html";
        return;
    }

    document.getElementById("emailDisplay").textContent = user.email;
    document.getElementById("idDisplay").textContent = user.id;

    const { data, error } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

    if (error) {
        console.error(error);
        document.getElementById("usernameDisplay").textContent = "Unknown";
        return;
    }

    document.getElementById("usernameDisplay").textContent = data.Username || "Unknown";

    if (data.pfp_url) {
        document.getElementById("profilePic").src = data.pfp_url;
    }
}

async function saveProfilePic() {
    const mcName = document.getElementById("mcUsername").value.trim();
    if (!mcName) return alert("Enter a Minecraft username.");

    const pfpURL = `https://crafatar.com/avatars/${mcName}?size=128&overlay`;

    const user = await AuthSystem.getUser();

    const { error } = await supabase
        .from("profiles")
        .update({ pfp_url: pfpURL })
        .eq("id", user.id);

    if (error) {
        console.error(error);
        alert("Failed to save profile picture.");
        return;
    }

    document.getElementById("profilePic").src = pfpURL;
    alert("Profile picture updated!");
}

async function logout() {
    await AuthSystem.logout();
    window.location.href = "/prosper/index.html";
}

document.addEventListener("DOMContentLoaded", loadDashboard);
</script>

</body>
</html>
