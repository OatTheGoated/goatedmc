<!DOCTYPE html>
<html>
<head>
  <title>Upload Schematic</title>
  <style>
    body { background:#111; color:#fff; font-family:Arial; padding:20px; }
    input, textarea, button { display:block; margin:10px 0; padding:10px; width:300px; border-radius:6px; border:none; }
    button { background:#4CAF50; color:white; cursor:pointer; }
  </style>
</head>
<body>

<h2>Upload Schematic</h2>

<input id="name" placeholder="Name">
<input id="tags" placeholder="Tags (comma separated)">
<textarea id="description" placeholder="Description"></textarea>

<h3>Schematic File (.schem / .litematic)</h3>
<input id="schemFile" type="file">

<h3>Preview Image (.webp)</h3>
<input id="imageFile" type="file">

<button id="uploadBtn">Upload</button>

<!-- ⭐ SCRIPT MOVED TO THE BOTTOM SO THE BUTTON EXISTS ⭐ -->
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://gthgxmyccwsygbopksgz.supabase.co",
    "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
  );

  // Check if admin is logged in
  const { data: { user } } = await supabase.auth.getUser();

  if (!user || user.user_metadata.role !== "admin") {
    alert("Access denied");
    window.location.href = "/prosper/admin/login.html";
  }

  document.getElementById("uploadBtn").onclick = async () => {
    const name = document.getElementById("name").value;
    const tags = document.getElementById("tags").value;
    const description = document.getElementById("description").value;

    const schemFile = document.getElementById("schemFile").files[0];
    const imageFile = document.getElementById("imageFile").files[0];

    if (!schemFile || !imageFile) {
      alert("Missing files");
      return;
    }

    // Upload schematic file
    const { error: schemErr } = await supabase.storage
      .from("schematics")
      .upload(schemFile.name, schemFile, { upsert: true });

    if (schemErr) {
      alert("Error uploading schematic");
      console.error(schemErr);
      return;
    }

    // Upload image file
    const { error: imgErr } = await supabase.storage
      .from("images")
      .upload(imageFile.name, imageFile, { upsert: true });

    if (imgErr) {
      alert("Error uploading image");
      console.error(imgErr);
      return;
    }

    // Insert metadata
    const { error: dbErr } = await supabase.from("schematics").insert({
      name,
      description,
      tags: tags.split(",").map(t => t.trim()),
      file: schemFile.name,
      image: imageFile.name,
      uploaded_by: user.email
    });

    if (dbErr) {
      alert("Error saving metadata");
      console.error(dbErr);
      return;
    }

    alert("Upload complete!");
  };
</script>

</body>
</html>
