<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GoatedMC Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Terminal Boot Screen -->
<div id="boot-screen">
    <div id="boot-text"></div>
</div>

<!-- Login Screen -->
<div id="login-screen" class="hidden">
    <div class="terminal-login">
        <h2>GoatedMC Admin Terminal</h2>
        <div class="terminal-line">Username:</div>
        <input id="login-email" type="email" placeholder="admin@example.com">

        <div class="terminal-line">Password:</div>
        <input id="login-password" type="password" placeholder="••••••••">

        <button id="login-btn">Access Terminal</button>
        <div id="login-error"></div>
    </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="hidden">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h1 class="logo">GoatedMC</h1>

        <nav>
            <button class="nav-btn active" data-page="upload">📤 Upload</button>
            <button class="nav-btn" data-page="manage">📁 Manage Schematics</button>
            <button class="nav-btn" data-page="settings">⚙️ Settings</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main>

        <!-- Upload Page -->
        <section id="page-upload" class="page active">

            <h2>Upload Schematic</h2>

            <div class="card drop-zone" id="schematic-drop">
                <p>Drop your .schem file here or click to upload</p>
                <input type="file" id="schematic-input" accept=".schem">
            </div>

            <div class="card drop-zone" id="image-drop">
                <p>Drop your WebP image here or click to upload</p>
                <input type="file" id="image-input" accept=".webp">
            </div>

            <div class="card">
                <label>Name</label>
                <input id="schem-name" type="text">

                <label>Description</label>
                <textarea id="schem-desc"></textarea>

                <label>Tags (comma separated)</label>
                <input id="schem-tags" type="text">

                <button id="upload-btn" class="purple-btn">Upload</button>
                <div id="upload-status"></div>
            </div>

        </section>

        <!-- Manage Page -->
        <section id="page-manage" class="page">
            <h2>Manage Schematics</h2>
            <div id="schem-list"></div>
        </section>

        <!-- Settings Page -->
        <section id="page-settings" class="page">
            <h2>Settings</h2>
            <button id="logout-btn" class="purple-btn">Logout</button>
        </section>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
