<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <style>
    body { background:#111; color:#fff; font-family:Arial; text-align:center; padding-top:50px; }
    input, button { padding:10px; margin:10px; width:250px; border-radius:6px; border:none; }
    button { background:#4CAF50; color:white; cursor:pointer; }
  </style>
</head>
<body>

<h2>Admin Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://gthgxmyccwsygbopksgz.supabase.co",
    "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
  );

  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      alert("Login failed");
      return;
    }

    window.location.href = "/prosper/admin/upload.html";
  };
</script>

</body>
</html>
