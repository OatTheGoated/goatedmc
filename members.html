<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Goated MC</title>
    <link rel="stylesheet" href="/goatedmc/style.css?v=1">
</head>

<body>
<div class="site">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Goated MC</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="members.html" class="active">Members</a></li>
            </ul>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container">
        <h1 class="pixel" style="color:#00ff88; text-align:center;">👥 Members</h1>
        <p class="pixel-small" style="margin-bottom: 2rem; text-align:center;">
            Meet the team behind Goated MC.
        </p>

        <!-- MEMBER GRID -->
        <section class="member-grid">

            <div class="member-card">
                <img src="images/Oat.webp" class="member-img" loading="lazy">
                <h3 class="pixel">Oat</h3>
                <p class="pixel-small">Founder • Modpack Creator • Content Creator</p>
            </div>

            <div class="member-card">
                <img src="images/Crowqe.webp" class="member-img" loading="lazy">
                <h3 class="pixel">Crowqe</h3>
                <p class="pixel-small">Builder • Content Creator</p>
            </div>

            <div class="member-card">
                <img src="images/CluckinTruck.webp" class="member-img" loading="lazy">
                <h3 class="pixel">CluckinTruck</h3>
                <p class="pixel-small">Content Creator</p>
            </div>

        </section>
    </main>

    <!-- FOOTER -->
    <footer class="pixel-small">
        <p>&copy; 2026 Goated MC. Made with ❤️ for Minecraft</p>
    </footer>

</div>

<!-- Fade-in script -->
<script>
window.addEventListener("load", () => {
    document.querySelectorAll("img, iframe").forEach(el => {
        if (el.complete) {
            el.classList.add("loaded");
        } else {
            el.addEventListener("load", () => {
                el.classList.add("loaded");
            });
        }
    });
});
</script>

</body>
</html>
