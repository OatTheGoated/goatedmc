<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProsperMC Schematics</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .schem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .schem-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
        }

        .schem-card img {
            width: 100%;
            border-radius: 8px;
        }

        .schem-card h3 {
            margin-top: 10px;
            font-size: 20px;
        }

        .schem-card p {
            font-size: 14px;
            opacity: 0.85;
        }

        .schem-card button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .like-btn {
            background: #ff4444 !important;
        }
    </style>
</head>
<body>

<h1>ProsperMC Schematics</h1>

<div id="schemContainer" class="schem-grid"></div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient("YOUR_URL", "YOUR_ANON_KEY");

    async function loadSchematics() {
        const { data: schems, error } = await supabase
            .from("schematics")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        const container = document.getElementById("schemContainer");
        container.innerHTML = "";

        schems.forEach(s => {
            const card = document.createElement("div");
            card.className = "schem-card";

            // FIXED BUCKET + FIXED FIELD NAME
            const imageUrl = supabase.storage
                .from("images")
                .getPublicUrl(s.image).data.publicUrl;

            // FIXED FIELD NAME
            const fileUrl = supabase.storage
                .from("schematics")
                .getPublicUrl(s.file).data.publicUrl;

            card.innerHTML = `
                <img src="${imageUrl}" alt="${s.name}">
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <p><strong>Tags:</strong> ${Array.isArray(s.tags) ? s.tags.join(", ") : s.tags}</p>

                <button onclick="window.location='${fileUrl}'">
                    Download Schematic
                </button>

                <button class="like-btn" onclick="likeSchematic('${s.id}')">
                    ❤️ Like (${s.likes ?? 0})
                </button>
            `;

            container.appendChild(card);
        });
    }

    async function likeSchematic(id) {
        const { data: userData } = await supabase.auth.getUser();
        if (!userData.user) {
            alert("You must be logged in to like schematics.");
            return;
        }

        const userId = userData.user.id;

        const { error } = await supabase
            .from("schematic_likes")
            .insert({ user_id: userId, schematic_id: id });

        if (error) {
            alert("You already liked this schematic.");
            return;
        }

        await supabase.rpc("increment_like", { schem_id: id });
        loadSchematics();
    }

    loadSchematics();
</script>

</body>
</html>
