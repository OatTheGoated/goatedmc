<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProsperMC Schematics</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .schem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .schem-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
        }

        .schem-card img {
            width: 100%;
            border-radius: 8px;
        }

        .schem-card h3 {
            margin-top: 10px;
            font-size: 20px;
        }

        .schem-card p {
            font-size: 14px;
            opacity: 0.85;
        }

        .schem-card button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .like-btn {
            background: #ff4444 !important;
        }

        .delete-btn {
            background: #aa0000 !important;
        }
    </style>
</head>
<body>

<h1>ProsperMC Schematics</h1>

<div id="schemContainer" class="schem-grid"></div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://gthgxmyccwsygbopksgz.supabase.co",
        "sb_publishable_rj-DwglUPiebIvlhWzoHhg_2632GYgW"
    );

    let currentUser = null;

    async function loadUser() {
        const { data: { user } } = await supabase.auth.getUser();
        currentUser = user;
    }

    async function loadSchematics() {
        await loadUser();

        const { data: schems, error } = await supabase
            .from("schematics")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) {
            console.error("Error loading schematics:", error);
            return;
        }

        const container = document.getElementById("schemContainer");
        container.innerHTML = "";

        for (const s of schems) {

            // ⭐ Get image URL
            const imageUrl = supabase.storage
                .from("images")
                .getPublicUrl(s.image).data.publicUrl;

            // ⭐ Get schematic file URL
            const fileUrl = supabase.storage
                .from("schematics")
                .getPublicUrl(s.file).data.publicUrl;

            // ⭐ Count likes
            const { count } = await supabase
                .from("schematic_likes")
                .select("*", { count: "exact", head: true })
                .eq("schematic_id", s.id);

            const card = document.createElement("div");
            card.className = "schem-card";

            card.innerHTML = `
                <img src="${imageUrl}" alt="${s.name}">
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <p><strong>Tags:</strong> ${Array.isArray(s.tags) ? s.tags.join(", ") : s.tags}</p>

                <button onclick="window.location='${fileUrl}'">
                    Download Schematic
                </button>

                <button class="like-btn" onclick="likeSchematic('${s.id}')">
                    ❤️ Like (${count})
                </button>
            `;

            // ⭐ Admin delete button
            if (currentUser && currentUser.user_metadata.role === "admin") {
                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerText = "🗑️ Delete Schematic";
                delBtn.onclick = () => deleteSchematic(s);
                card.appendChild(delBtn);
            }

            container.appendChild(card);
        }
    }

    async function likeSchematic(id) {
        const { data: { user } } = await supabase.auth.getUser();

        if (!user) {
            alert("You must be logged in to like schematics.");
            return;
        }

        const { error } = await supabase
            .from("schematic_likes")
            .insert({ user_id: user.id, schematic_id: id });

        if (error) {
            alert("You already liked this schematic.");
            return;
        }

        loadSchematics();
    }

    // ⭐ ADMIN DELETE (DB + storage)
    async function deleteSchematic(s) {
        if (!confirm("Are you sure you want to delete this schematic?")) return;

        // Delete image file
        await supabase.storage.from("images").remove([s.image]);

        // Delete schematic file
        await supabase.storage.from("schematics").remove([s.file]);

        // Delete DB row
        await supabase.from("schematics").delete().eq("id", s.id);

        // Delete likes associated with this schematic
        await supabase.from("schematic_likes").delete().eq("schematic_id", s.id);

        alert("Schematic deleted.");
        loadSchematics();
    }

    loadSchematics();
</script>

</body>
</html>
